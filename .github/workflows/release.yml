name: BlockSkript Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''

          if (Test-Path "CHANGELOG.md") {
            $body = Get-Content "CHANGELOG.md" -Raw
          } else {
            $body = "## 🚀 BlockSkript v$version`n`nNowa wersja BlockSkript."
          }

          gh release create "$tag" `
            --repo "${{ github.repository }}" `
            --title "BlockSkript v$version" `
            --notes "$body" `
            --latest

      - name: Build BlockSkript
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist
