name: BlockSkript Release Discord

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Get release information
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(gh release view "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --json name,body,url)

          echo "$RELEASE" > release.json

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          with open("release.json", encoding="utf-8") as f:
              release = json.load(f)

          name = release["name"]
          body = release.get("body") or "Brak informacji o aktualizacji."
          url = release["url"]

          payload = {
              "username": "BlockSkript",
              "embeds": [{
                  "title": name,
                  "description": body,
                  "url": url,
                  "footer": {
                      "text": "BlockSkript • GitHub Releases"
                  }
              }]
          }

          data = json.dumps(payload, ensure_ascii=False).encode("utf-8")

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "BlockSkript"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print("Discord:", response.status)
          PY
