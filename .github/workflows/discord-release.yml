name: BlockSkript Release Discord

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag wydania, np. v26.8.7"
        required: true
        default: "v26.8.7"

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Set release tag
        id: tag
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            echo "tag=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$PUSH_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Get release information
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "Pobieram Release: $TAG"

          gh release view "$TAG" \
            --repo "${{ github.repository }}" \
            --json name,body,url > release.json

          cat release.json

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          with open("release.json", encoding="utf-8") as f:
              release = json.load(f)

          name = release["name"]
          body = release.get("body") or "Brak informacji o aktualizacji."
          url = release["url"]

          payload = {
              "username": "BlockSkript",
              "embeds": [{
                  "title": name,
                  "description": body,
                  "url": url,
                  "footer": {
                      "text": "BlockSkript • GitHub Releases"
                  }
              }]
          }

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "BlockSkript"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print("Discord HTTP:", response.status)
          PY
