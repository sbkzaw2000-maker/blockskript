name: BlockSkript Release Discord

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja istniejącego Release, np. 'v26.8.6'"
        required: true
        type: string

jobs:
  discord:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Sprawdź webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "BŁĄD: Brak sekretu DISCORD_WEBHOOK!"
            exit 1
          fi

      - name: Znajdź Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"

          echo "Szukam Release:"
          echo "$TAG"

          RELEASE_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --header "Accept: application/vnd.github+json")

          if [ -z "$RELEASE_JSON" ]; then
            echo "BŁĄD: GitHub nie zwrócił danych Release!"
            exit 1
          fi

          echo "$RELEASE_JSON" > release.json

          echo "Release znaleziony!"

          RELEASE_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          RELEASE_NAME=$(echo "$RELEASE_JSON" | jq -r '.name')

          echo "Tag: $RELEASE_TAG"
          echo "Nazwa: $RELEASE_NAME"

      - name: Sprawdź CHANGELOG
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "BŁĄD: Brak CHANGELOG.md!"
            exit 1
          fi

          echo "CHANGELOG.md znaleziony."

      - name: Wyślij Embed na Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          VERSION=$(jq -r '.tag_name' release.json)

          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ["DISCORD_WEBHOOK"]

          with open("release.json", "r", encoding="utf-8") as f:
              release = json.load(f)

          version = release["tag_name"]

          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              changelog = f.read().strip()

          if not changelog:
              changelog = "Brak informacji o aktualizacji."

          payload = {
              "username": "BlockSkript",
              "embeds": [
                  {
                      "title": f"# BlockSkript {version}",
                      "description": (
                          "Dostępna jest nowa wersja **BlockSkript**\n\n"
                          f"📦 Wersja `{version}`\n\n"
                          "## Informacje o aktualizacji:\n"
                          f"{changelog}"
                      ),
                      "color": 5763719,
                      "footer": {
                          "text": "BlockSkript • GitHub Releases"
                      }
                  }
              ]
          }

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "BlockSkript-GitHub-Actions"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print("Discord HTTP:", response.status)
                  print("====================================")
                  print("SUKCES!")
                  print(f"BlockSkript {version} wysłany na Discord.")
                  print("====================================")

          except urllib.error.HTTPError as e:
              print("BŁĄD DISCORD:", e.code)
              print(
                  e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              raise
          PY
