name: BlockSkript Release Discord

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja istniejącego Release, np. v26.8.6"
        required: true
        type: string

jobs:
  discord:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Sprawdź webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "BŁĄD: Brak sekretu DISCORD_WEBHOOK!"
            exit 1
          fi

      - name: Znajdź Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          token = os.environ["GH_TOKEN"]
          version = os.environ["VERSION"].strip()
          repository = os.environ["REPOSITORY"]

          if not version.startswith("v"):
              version = "v" + version

          print("Szukam Release dla taga:", version)
          print("Repozytorium:", repository)

          url = f"https://api.github.com/repos/{repository}/releases"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "BlockSkript-GitHub-Actions"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  releases = json.loads(
                      response.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as e:
              print("BŁĄD GITHUB API:", e.code)
              print(
                  e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              raise SystemExit(1)

          found = None

          for release in releases:
              print(
                  "Release:",
                  release.get("tag_name"),
                  "|",
                  release.get("name")
              )

              if release.get("tag_name") == version:
                  found = release
                  break

          if found is None:
              print("")
              print("====================================")
              print("BŁĄD: Nie znaleziono Release!")
              print("Szukany tag:", version)
              print("====================================")
              raise SystemExit(1)

          with open(
              "release.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  found,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("====================================")
          print("ZNALEZIONO RELEASE!")
          print("Tag:", found.get("tag_name"))
          print("Nazwa:", found.get("name"))
          print("====================================")
          PY

      - name: Sprawdź CHANGELOG
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "BŁĄD: Brak pliku CHANGELOG.md!"
            exit 1
          fi

          echo "CHANGELOG.md znaleziony."

      - name: Wyślij Embed na Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ["DISCORD_WEBHOOK"]

          with open(
              "release.json",
              "r",
              encoding="utf-8"
          ) as file:
              release = json.load(file)

          version = release["tag_name"]

          with open(
              "CHANGELOG.md",
              "r",
              encoding="utf-8"
          ) as file:
              changelog = file.read().strip()

          if not changelog:
              changelog = "Brak informacji o aktualizacji."

          description = (
              "Dostępna jest nowa wersja **BlockSkript**\n\n"
              f"📦 Wersja `{version}`\n\n"
              "## Informacje o aktualizacji:\n"
              f"{changelog}"
          )

          payload = {
              "username": "BlockSkript",
              "embeds": [
                  {
                      "title": f"# BlockSkript {version}",
                      "description": description,
                      "color": 5763719,
                      "footer": {
                          "text": "BlockSkript • GitHub Releases"
                      }
                  }
              ]
          }

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "BlockSkript-GitHub-Actions"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print("Discord HTTP:", response.status)
                  print("")
                  print("====================================")
                  print("SUKCES!")
                  print(f"BlockSkript {version} wysłany na Discord.")
                  print("====================================")

          except urllib.error.HTTPError as e:
              print("BŁĄD DISCORD:", e.code)
              print(
                  e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              raise
          PY
