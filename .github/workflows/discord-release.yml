name: BlockSkript Release → Discord

on:
  release:
    types: [published]

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Sprawdź Release i wyślij na Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "Nazwa Release: $RELEASE_NAME"
          echo "Tag: $RELEASE_TAG"

          # Akceptuj tylko:
          # BlockSkript v26.8.5
          # BlockSkript v26.8.6
          # BlockSkript v27.0.0

          if [[ ! "$RELEASE_NAME" =~ ^BlockSkript\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ten Release nie jest Release BlockSkript."
            exit 0
          fi

          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "BLAD: Nie ustawiono DISCORD_WEBHOOK."
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"

          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ["DISCORD_WEBHOOK"]
          body = os.environ.get("RELEASE_BODY") or "Brak informacji o aktualizacji."
          tag = os.environ["RELEASE_TAG"]

          version = tag[1:] if tag.startswith("v") else tag

          payload = {
              "username": "BlockSkript",
              "embeds": [
                  {
                      "title": f"# BlockSkript v{version}",
                      "description": (
                          "Dostępna jest nowa wersja **BlockSkript**\n\n"
                          f"📦 Wersja `v{version}`\n"
                          "\n"
                          "## Informacje o aktualizacji:\n"
                          f"{body}"
                      ),
                      "color": 5763719
                  }
              ]
          }

          data = json.dumps(payload, ensure_ascii=False).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "BlockSkript-Release-Webhook"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print("Discord HTTP:", response.status)

                  if response.status not in (200, 204):
                      raise Exception(
                          f"Discord zwrócił nieprawidłowy kod: {response.status}"
                      )

                  print("Wiadomość została wysłana na Discord.")
                  
          except urllib.error.HTTPError as e:
              print("BLAD DISCORD:", e.code)
              print(e.read().decode("utf-8", errors="replace"))
              raise
          PY
