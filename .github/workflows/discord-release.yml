name: BlockSkript Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Odczytaj wersję
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Wersja: $version"

      - name: Zbuduj i opublikuj
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ustaw nazwę i opis Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $name = "BlockSkript v$env:VERSION"

          if (Test-Path "CHANGELOG.md") {
            $body = Get-Content "CHANGELOG.md" -Raw
          } else {
            $body = "Brak informacji o aktualizacji."
          }

          $json = @{
            tag_name = $tag
            name = $name
            body = $body
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "https://api.github.com/repos/sbkzaw2000-maker/blockskript/releases/tags/$tag" `
            -Method PATCH `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } `
            -ContentType "application/json" `
            -Body $json
