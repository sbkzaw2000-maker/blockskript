name: BlockSkript Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Odczytaj wersję
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Wersja: $version"

      - name: Zbuduj aplikację
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Utwórz GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $name = "BlockSkript v$env:VERSION"

          if (Test-Path "CHANGELOG.md") {
            $body = Get-Content "CHANGELOG.md" -Raw
          } else {
            $body = "Brak informacji o aktualizacji."
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $releaseData = @{
            tag_name = $tag
            target_commitish = "main"
            name = $name
            body = $body
            draft = $false
            prerelease = $false
          } | ConvertTo-Json

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases" `
            -Method POST `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $releaseData

          Write-Host "Release utworzony: $($release.html_url)"

          $exe = Get-ChildItem "dist\*.exe" | Select-Object -First 1

          if (-not $exe) {
            Write-Error "Nie znaleziono pliku EXE!"
            exit 1
          }

          $uploadUrl = "https://uploads.github.com/repos/${{ github.repository }}/releases/$($release.id)/assets?name=$($exe.Name)"

          Invoke-RestMethod `
            -Uri $uploadUrl `
            -Method POST `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
            } `
            -ContentType "application/octet-stream" `
            -InFile $exe.FullName

          Write-Host "EXE wysłane: $($exe.Name)"
        
