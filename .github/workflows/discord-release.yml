```yaml
name: BlockSkript Release Discord

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          name = os.environ.get("RELEASE_NAME") or (
              "BlockSkript " + os.environ["RELEASE_TAG"]
          )

          body = os.environ.get("RELEASE_BODY") or \
              "Brak informacji o aktualizacji."

          url = os.environ["RELEASE_URL"]

          payload = {
              "username": "BlockSkript",
              "embeds": [{
                  "title": name,
                  "description": body,
                  "url": url,
                  "footer": {
                      "text": "BlockSkript • GitHub Releases"
                  }
              }]
          }

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "BlockSkript"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print("Discord HTTP:", response.status)
          PY
```
