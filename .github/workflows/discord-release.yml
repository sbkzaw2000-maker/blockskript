name: BlockSkript Release → Discord

on:
release:
types: [published]

jobs:
discord:
runs-on: ubuntu-latest

```
steps:
  - name: Wyślij Release na Discord
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      RELEASE_NAME: ${{ github.event.release.name }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_BODY: ${{ github.event.release.body }}
    run: |
      # Wysyłaj tylko Release'y BlockSkript
      if [[ ! "$RELEASE_NAME" =~ ^BlockSkript\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        echo "Release '$RELEASE_NAME' nie jest Release'em BlockSkript."
        exit 0
      fi

      python3 - <<'PY'
      import json
      import os
      import urllib.request
      import sys

      webhook = os.environ["DISCORD_WEBHOOK"]
      tag = os.environ["RELEASE_TAG"]
      release_name = os.environ["RELEASE_NAME"]
      release_body = os.environ.get("RELEASE_BODY") or "Brak informacji o aktualizacji."

      # Pobierz wersję tylko z taga, np. v26.8.6 -> 26.8.6
      if not tag.startswith("v"):
          print("Nieprawidłowy tag:", tag)
          sys.exit(0)

      version = tag[1:]

      # Dodatkowa walidacja wersji
      import re

      if not re.fullmatch(r"\d+\.\d+\.\d+", version):
          print("Tag nie jest poprawną wersją:", tag)
          sys.exit(0)

      payload = {
          "username": "BlockSkript",
          "embeds": [
              {
                  "title": f"BlockSkript v{version}",
                  "description": (
                      "Dostępna jest nowa wersja **BlockSkript**\n\n"
                      f"📦 Wersja `v{version}`\n"
                      "\n"
                      "## Informacje o aktualizacji:\n"
                      f"{release_body}"
                  ),
                  "color": 5763719
              }
          ]
      }

      data = json.dumps(payload, ensure_ascii=False).encode("utf-8")

      request = urllib.request.Request(
          webhook,
          data=data,
          headers={
              "Content-Type": "application/json",
              "User-Agent": "BlockSkript-GitHub-Actions"
          },
          method="POST"
      )

      with urllib.request.urlopen(request) as response:
          print(f"Discord HTTP: {response.status}")

          if response.status < 200 or response.status >= 300:
              print("Discord zwrócił błąd.")
              sys.exit(1)

      print(f"Wysłano Discord Embed dla BlockSkript {tag}")
```

