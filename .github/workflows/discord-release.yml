name: BlockSkript Release Discord

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag istniejącego Release, np. v26.8.9"
        required: true
        type: string

jobs:
  discord:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Sprawdź CHANGELOG
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "BŁĄD: Brak pliku CHANGELOG.md!"
            exit 1
          fi

      - name: Pobierz istniejący Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          token = os.environ["GH_TOKEN"]
          version = os.environ["VERSION"]
          repository = os.environ["REPOSITORY"]

          if not version.startswith("v"):
              print("BŁĄD: Wersja musi zaczynać się od v, np. v26.8.9")
              raise SystemExit(1)

          url = f"https://api.github.com/repos/{repository}/releases/tags/{version}"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "BlockSkript-GitHub-Actions"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  release = json.loads(response.read().decode("utf-8"))

          except urllib.error.HTTPError as e:
              print("BŁĄD: Nie znaleziono Release!")
              print("HTTP:", e.code)
              raise SystemExit(1)

          with open("/tmp/release.json", "w", encoding="utf-8") as file:
              json.dump(release, file, ensure_ascii=False, indent=2)

          print("Znaleziono Release:")
          print("Nazwa:", release.get("name"))
          print("Tag:", release.get("tag_name"))
          print("URL:", release.get("html_url"))
          PY

      - name: Wyślij ponownie na Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ["DISCORD_WEBHOOK"]

          with open("/tmp/release.json", "r", encoding="utf-8") as file:
              release = json.load(file)

          version = release["tag_name"]
          release_name = release.get("name") or f"BlockSkript {version}"
          release_url = release["html_url"]

          with open("CHANGELOG.md", "r", encoding="utf-8") as file:
              changelog = file.read().strip()

          description = (
              "Dostępna jest nowa wersja **BlockSkript**\n\n"
              f"📦 Wersja `{version}`\n\n"
              "## Informacje o aktualizacji:\n"
              f"{changelog}"
          )

          payload = {
              "username": "BlockSkript",
              "embeds": [
                  {
                      "title": f"# BlockSkript {version}",
                      "description": description,
                      "url": release_url,
                      "color": 5763719,
                      "footer": {
                          "text": "BlockSkript • GitHub Releases"
                      }
                  }
              ]
          }

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "BlockSkript-GitHub-Actions"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print("Discord HTTP:", response.status)
                  print("Ponowna wysyłka zakończona pomyślnie!")

          except urllib.error.HTTPError as e:
              print("BŁĄD DISCORD:", e.code)
              print(e.read().decode("utf-8", errors="replace"))
              raise
          PY
