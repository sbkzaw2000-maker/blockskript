name: BlockSkript Release Discord

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag istniejącego Release, np. v26.8.6"
        required: true
        type: string

jobs:
  discord:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Sprawdź webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "BŁĄD: Brak sekretu DISCORD_WEBHOOK!"
            exit 1
          fi

      - name: Pobierz istniejący Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"

          echo "===================================="
          echo "Szukam Release:"
          echo "$TAG"
          echo "===================================="

          if ! gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name \
            > release.json; then

            echo ""
            echo "===================================="
            echo "BŁĄD: Nie znaleziono Release!"
            echo "Szukany tag: $TAG"
            echo "===================================="
            echo ""
            echo "Dostępne Release:"
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 20

            exit 1
          fi

          echo ""
          echo "===================================="
          echo "ZNALEZIONO RELEASE!"
          echo "===================================="

          cat release.json

      - name: Sprawdź CHANGELOG
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "BŁĄD: Brak pliku CHANGELOG.md!"
            exit 1
          fi

          echo "CHANGELOG.md znaleziony."

      - name: Wyślij Embed na Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          VERSION=$(jq -r '.tagName' release.json)

          echo "Wysyłam wersję: $VERSION"

          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ["DISCORD_WEBHOOK"]

          with open(
              "release.json",
              "r",
              encoding="utf-8"
          ) as file:
              release = json.load(file)

          version = release["tagName"]

          with open(
              "CHANGELOG.md",
              "r",
              encoding="utf-8"
          ) as file:
              changelog = file.read().strip()

          if not changelog:
              changelog = "Brak informacji o aktualizacji."

          description = (
              "Dostępna jest nowa wersja **BlockSkript**\n\n"
              f"📦 Wersja `{version}`\n\n"
              "## Informacje o aktualizacji:\n"
              f"{changelog}"
          )

          payload = {
              "username": "BlockSkript",
              "embeds": [
                  {
                      "title": f"# BlockSkript {version}",
                      "description": description,
                      "color": 5763719,
                      "footer": {
                          "text": "BlockSkript • GitHub Releases"
                      }
                  }
              ]
          }

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "BlockSkript-GitHub-Actions"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print("")
                  print("====================================")
                  print("SUKCES!")
                  print(f"BlockSkript {version} wysłany na Discord.")
                  print("Discord HTTP:", response.status)
                  print("====================================")

          except urllib.error.HTTPError as e:
              print("")
              print("BŁĄD DISCORD:", e.code)
              print(
                  e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              raise
          PY
