name: BlockSkript Release Discord

on:
  release:
    types:
      - published

  workflow_dispatch:

jobs:
  discord:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Sprawdź webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "BŁĄD: Brak sekretu DISCORD_WEBHOOK!"
            exit 1
          fi

      - name: TEST - wyślij testowy Embed
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ["DISCORD_WEBHOOK"]

          payload = {
              "username": "BlockSkript",
              "embeds": [
                  {
                      "title": "# BlockSkript v26.8.6",
                      "description": (
                          "Dostępna jest nowa wersja **BlockSkript**\n\n"
                          "📦 Wersja `v26.8.6`\n\n"
                          "## Informacje o aktualizacji:\n"
                          "🧪 To jest **wiadomość testowa**."
                      ),
                      "color": 5763719
                  }
              ]
          }

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "BlockSkript-GitHub-Actions"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print("Discord HTTP:", response.status)
                  print("TEST ZAKOŃCZONY POMYŚLNIE!")

          except urllib.error.HTTPError as e:
              print("BŁĄD DISCORD:", e.code)
              print(e.read().decode("utf-8", errors="replace"))
              raise
          PY

      - name: Sprawdź CHANGELOG
        if: github.event_name == 'release'
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "BŁĄD: Brak CHANGELOG.md"
            exit 1
          fi

      - name: Ustaw opis GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          release_id = os.environ["RELEASE_ID"]
          token = os.environ["GH_TOKEN"]

          with open("CHANGELOG.md", "r", encoding="utf-8") as file:
              changelog = file.read().strip()

          url = f"https://api.github.com/repos/{repository}/releases/{release_id}"

          data = json.dumps({
              "body": changelog
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(request) as response:
              print("GitHub Release HTTP:", response.status)
              print("Opis Release został ustawiony z CHANGELOG.md.")
          PY

      - name: Wyślij Release na Discord
        if: github.event_name == 'release'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ["DISCORD_WEBHOOK"]
          version = os.environ["RELEASE_TAG"]

          with open("CHANGELOG.md", "r", encoding="utf-8") as file:
              changelog = file.read().strip()

          payload = {
              "username": "BlockSkript",
              "embeds": [
                  {
                      "title": f"# BlockSkript {version}",
                      "description": (
                          "Dostępna jest nowa wersja **BlockSkript**\n\n"
                          f"📦 Wersja `{version}`\n\n"
                          f"{changelog}"
                      ),
                      "color": 5763719
                  }
              ]
          }

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "BlockSkript-GitHub-Actions"
              }
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print("Discord HTTP:", response.status)
                  print("Release wysłany na Discord.")

          except urllib.error.HTTPError as e:
              print("BŁĄD DISCORD:", e.code)
              print(e.read().decode("utf-8", errors="replace"))
              raise
          PY
